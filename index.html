<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Hall Tour</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d10;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:white}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .topbar{position:fixed;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
  .pill{background:rgba(0,0,0,.56);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
  #hint{font-weight:500;opacity:.88}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b0d10;z-index:100;font-size:16px}
  .dots::after{content:'...';animation:dots 1.2s steps(4,end) infinite} @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
  .error{max-width:620px;padding:24px;text-align:center;line-height:1.45}

  *{box-sizing:border-box}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #bceaff;outline-offset:4px}button:disabled{opacity:.3;cursor:default}
  .topbar{top:max(24px,env(safe-area-inset-top));left:28px;right:28px;align-items:flex-start;gap:20px}
  .brand{padding:16px 20px;border-radius:18px;background:rgba(15,24,30,.8);border:1px solid #ffffff26;backdrop-filter:blur(18px);box-shadow:0 8px 32px #0003}
  .eyebrow{display:block;font-size:10px;letter-spacing:.2em;color:#a9d6dc;font-weight:700;margin-bottom:7px}.brand strong{font-size:20px;font-weight:600;letter-spacing:-.03em}.brand small{display:block;color:#c1cbd0;font-size:12px;margin-top:6px}
  .tools{display:flex;gap:8px;pointer-events:auto}.tool{width:44px;height:44px;border-radius:50%;background:#111d24cc;border:1px solid #ffffff35;font-size:20px;backdrop-filter:blur(16px)}.tool:hover{background:#29444e}.tool[aria-pressed="true"]{background:#c0edf0;color:#102b32;border-color:#d9faff}
  .bottom{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;flex-direction:column;gap:14px;max-width:calc(100% - 24px)}
  #hint{font-size:12px;color:#fff;text-shadow:0 1px 5px #000;background:#0d171a99;border-radius:99px;padding:7px 14px;white-space:nowrap}
  .nav{display:flex;align-items:center;gap:24px;background:#101b22ed;border:1px solid #ffffff29;border-radius:20px;padding:12px;box-shadow:0 12px 40px #0005;backdrop-filter:blur(20px)}
  .nav button{border:0;background:transparent;border-radius:12px;min-height:44px}.nav .step{padding:0 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:12px}.step:hover:not(:disabled){background:#ffffff12}.step span{font-size:23px}.nav .next{background:#c0edf0;color:#102b32}.nav .next:hover:not(:disabled){background:#d9faff}
  .stops{display:flex;align-items:center;gap:8px;position:relative}.stops:before{content:'';position:absolute;left:15px;right:15px;height:1px;background:#ffffff30;z-index:-1}.stops .stop{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#243139;color:#becbd1;border:1px solid #ffffff20;font-size:12px;user-select:none}.stops .stop[aria-current="step"]{background:#c0edf0;color:#102b32;box-shadow:0 0 0 4px #c0edf017}
  #loading{background:radial-gradient(ellipse at center,#233e46,#0b1218);text-align:center;line-height:1.8}#loading .loader-title{font-size:27px;letter-spacing:-.04em;font-weight:600}#loading p{font-size:13px;color:#a5bec5}.spinner{width:32px;height:32px;border:2px solid #ffffff20;border-top-color:#c0edf0;border-radius:50%;animation:spin 1s linear infinite;margin:24px auto}@keyframes spin{to{transform:rotate(360deg)}}
  #status{position:fixed;top:145px;left:50%;transform:translateX(-50%);z-index:20;border-radius:12px;background:#12232aeb;padding:12px 18px;font-size:13px;max-width:90%;text-align:center}#status:empty{display:none}
  @media(max-width:600px){.topbar{left:12px;right:12px;top:max(12px,env(safe-area-inset-top))}.brand{padding:10px 13px;border-radius:15px}.brand .eyebrow{display:none}.brand strong{font-size:16px}.brand small{font-size:11px;margin-top:4px}.tools{gap:5px}.tool{width:38px;height:38px}.bottom{bottom:max(12px,env(safe-area-inset-bottom));gap:9px}.nav{gap:8px;padding:8px;border-radius:16px}.nav .step{width:42px;min-height:42px;padding:0;justify-content:center;font-size:0}.nav .step span{font-size:23px}.stops{gap:6px}.stops .stop{width:29px;height:29px;font-size:11px}#hint{font-size:10px;padding:6px 11px;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.tools #zoom-in,.tools #zoom-out{display:none}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none}}

  #travel-frame{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none;will-change:transform,opacity,filter}
  body.moving .tools{pointer-events:none}
</style>

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
function renderQuality(){
  // Supersample ordinary displays; cap the drawing buffer on large screens.
  const pixelBudget=matchMedia('(pointer:coarse)').matches?3000000:6000000;
  const budget=Math.sqrt(pixelBudget/(innerWidth*innerHeight));
  renderer.setPixelRatio(Math.max(1,Math.min(Math.max(devicePixelRatio,1.35),2,budget)));
}

const loader=new GLTFLoader();
const preloadCache=new Map();
let preloadWanted=null,lastTravelDirection=1;
function preloadCheckpoint(i){
  if(i<0 || i>=DATA.length || i===current || (preloadWanted===i&&preloadCache.has(i)))return;
  preloadWanted=i;
  for(const key of preloadCache.keys())if(key!==i)preloadCache.delete(key);
  const task=loader.loadAsync(DATA[i]).then(gltf=>{
    if(preloadWanted!==i){dispose(gltf.scene);return null;}
    return gltf;
  }).catch(err=>{preloadCache.delete(i);console.warn('Preload failed for checkpoint',i+1,err);return null;});
  preloadCache.set(i,task);
}
function scheduleLikelyPreload(){
  const preferred=current+lastTravelDirection;
  const fallback=current-lastTravelDirection;
  const target=preferred>=0&&preferred<DATA.length?preferred:(fallback>=0&&fallback<DATA.length?fallback:null);
  if(target==null)return;
  const run=()=>preloadCheckpoint(target);
  if('requestIdleCallback' in window)requestIdleCallback(run,{timeout:900});else setTimeout(run,250);
}

function prep(root){
  const aniso=renderer.capabilities.getMaxAnisotropy();
  root.traverse(o=>{
    if(!o.isMesh) return;
    const oldMats=Array.isArray(o.material)?o.material:[o.material];
    const newMats=oldMats.map(m=>{
      const bm=new THREE.MeshBasicMaterial({
        map:m && m.map ? m.map : null,
        color:0xffffff,
        side:THREE.DoubleSide,
        toneMapped:false
      });
      if(bm.map){
        bm.map.colorSpace=THREE.SRGBColorSpace;
        bm.map.anisotropy=aniso;
        bm.map.generateMipmaps=true;
        bm.map.minFilter=THREE.LinearMipmapLinearFilter;
        bm.map.magFilter=THREE.LinearFilter;
        bm.map.needsUpdate=true;

      }
      return bm;
    });
    o.material=Array.isArray(o.material)?newMats:newMats[0];
  });
}

function makeArrowHotspot(kind='forward'){
  const root=new THREE.Group();
  const floorMaterial=(color,opacity)=>new THREE.MeshBasicMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false,depthTest:false,toneMapped:false});
  function surface(geometry,material,height,order){
    const mesh=new THREE.Mesh(geometry,material);
    mesh.rotation.x=-Math.PI/2;mesh.position.y=height;mesh.renderOrder=order;root.add(mesh);return mesh;
  }
  // Generous invisible hit area; visual marker stays understated.
  const hit=surface(new THREE.CircleGeometry(0.34,48),floorMaterial(0xffffff,0),0,9);
  const inner=surface(new THREE.CircleGeometry(0.245,64),floorMaterial(0xffffff,0.14),0.001,10);
  const ring=surface(new THREE.RingGeometry(0.245,0.253,64),floorMaterial(0xffffff,0.36),0.002,11);
  const shape=new THREE.Shape();
  shape.moveTo(0,0.135);shape.lineTo(0.145,0.015);shape.lineTo(0.145,-0.075);
  shape.lineTo(0,0.038);shape.lineTo(-0.145,-0.075);shape.lineTo(-0.145,0.015);shape.closePath();
  const arrow=surface(new THREE.ShapeGeometry(shape),floorMaterial(0x20272a,0.55),0.003,12);
  root.userData={kind,hit,inner,ring,arrow,emphasis:0};
  hotspotGroup.add(root);hotspotRoots.push(root);return root;
}

const forwardHotspot=makeArrowHotspot('forward');
const backHotspot=makeArrowHotspot('back');

function placeOne(root, angle, visible){
  root.visible = visible && angle!=null;
  if(!root.visible) return;
  const dist = root.userData.kind==='forward' ? 1.02 : 1.02;
  root.position.set(Math.sin(angle)*dist, FLOOR_Y, -Math.cos(angle)*dist);
  // Bearings are clockwise from -Z; Three.js yaw is counterclockwise.
  root.rotation.y = -angle;
}

function placeHotspots(){
  placeOne(forwardHotspot, NEXT_ANGLES[current], current < DATA.length-1);
  placeOne(backHotspot, PREV_ANGLES[current], current > 0);
}

let lastHotspotFrame=0;
function updateHotspotVisuals(now=0){
  const elapsed=Math.min(100,Math.max(0,now-lastHotspotFrame));lastHotspotFrame=now;
  const blend=reducedMotion?1:1-Math.exp(-elapsed/100);
  for(const hs of hotspotRoots){
    const u=hs.userData;
    u.emphasis+=((hs===hoverHotspot&&!dragging?1:0)-u.emphasis)*blend;
    const e=u.emphasis,quiet=dragging?0.65:1;
    hs.scale.setScalar(0.64*(1+0.045*e));
    u.inner.material.opacity=(0.14+0.15*e)*quiet;
    u.ring.material.opacity=(0.36+0.30*e)*quiet;
    u.arrow.material.opacity=(0.55+0.22*e)*quiet;
  }
}

function hotspotRootFromHit(obj){
  let o=obj;
  while(o && o.parent && !o.userData?.kind) o=o.parent;
  return o && o.userData?.kind ? o : null;
}

function checkHotspotHover(clientX, clientY){
  const rect=el.getBoundingClientRect();
  pointer.x=((clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  camera.updateMatrixWorld();
  hotspotGroup.updateMatrixWorld(true);
  raycaster.setFromCamera(pointer,camera);
  const hits=transitioning || !ready ? [] : raycaster.intersectObjects(hotspotRoots.filter(root=>root.visible),true);
  hoverHotspot = hits.length ? hotspotRootFromHit(hits[0].object) : null;
  el.style.cursor = hoverHotspot ? 'pointer' : (dragging ? 'grabbing' : 'grab');
  el.title=hoverHotspot?'Go to checkpoint '+(current+(hoverHotspot.userData.kind==='forward'?2:0)):'';
}

function setCanvasFx(scale=1, blur=0, opacity=1){
  el.style.transform=`scale(${scale})`;
  el.style.filter=`blur(${blur}px)`;
  el.style.opacity=String(opacity);
}
function ease(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
function tween(ms, update){
  return new Promise(resolve=>{
    const start=performance.now();
    function step(now){
      const t=Math.min(1,(now-start)/ms);
      update(ease(t), t);
      if(t<1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}


const previous=document.getElementById('previous'), next=document.getElementById('next');
const stopButtons=[...document.querySelectorAll('[data-stop]')];
function updateControls(){
  previous.disabled=!ready || transitioning || current===0;
  next.disabled=!ready || transitioning || current===DATA.length-1;
  stopButtons.forEach((b,i)=>{b.toggleAttribute('aria-current',i===current);if(i===current)b.setAttribute('aria-current','step');});
  const exploreHint=motionEnabled?'Move phone or drag to explore':'Drag to explore';
  document.getElementById('hint').textContent=current===DATA.length-1?'Final checkpoint · explore or go back one stop':exploreHint+' · tap a floor arrow to move';
}
function resetView(){yaw=-(NEXT_ANGLES[current]??PREV_ANGLES[current]??VIEW_ANGLES[current]??0);pitch=0;camera.fov=72;camera.updateProjectionMatrix();camera.rotation.set(pitch,yaw,0);if(motionEnabled)motionNeedsCalibrate=true;}
function dispose(root){root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){for(const m of (Array.isArray(o.material)?o.material:[o.material])){m.map?.dispose();m.dispose();}}});}
async function loadCheckpoint(i, prepared=null){
  const gltf=prepared ?? await loader.loadAsync(DATA[i]);
  const replacement=gltf.scene;
  prep(replacement);
  replacement.traverse(mesh=>{
    if(!mesh.isMesh)return;
    mesh.geometry.dispose();
    const sphere=new THREE.SphereGeometry(10,256,128);
    // Preserve the export's bearings, seam, and top-to-bottom texture convention.
    sphere.scale(-1,1,1);sphere.rotateY(Math.PI/2);
    const uv=sphere.attributes.uv;
    for(let n=0;n<uv.count;n++)uv.setY(n,1-uv.getY(n));
    uv.needsUpdate=true;
    mesh.geometry=sphere;
    mesh.position.set(0,CAMERA_HEIGHT,0);mesh.rotation.set(i===2?THREE.MathUtils.degToRad(-1.5):0,0,0);mesh.scale.set(1,1,1);
  });
  if(object){scene.remove(object);dispose(object);}
  object=replacement;current=i;scene.add(object);
  camera.position.set(0,CAMERA_HEIGHT,0);resetView();
  cp.textContent=STOP_NAMES[i]+' · '+(i+1)+' of '+DATA.length;
  hoverHotspot=null;placeHotspots();ready=true;loading.style.display='none';updateControls();
}

const travelFrame=document.getElementById('travel-frame');
const travelContext=travelFrame.getContext('2d');
// Each panorama has its own orientation; these bearings all point along the route.
const routeBearings=[NEXT_ANGLES[0],NEXT_ANGLES[1],PREV_ANGLES[2]+Math.PI];
async function transitionTo(i){
  if(!ready || transitioning || i<0 || i>=DATA.length || i===current || Math.abs(i-current)!==1)return;
  const from=current, oldYaw=yaw, oldPitch=pitch, oldFov=camera.fov;
  const direction=i>current?1:-1;
  lastTravelDirection=direction;
  const bearing=direction>0?NEXT_ANGLES[current]:PREV_ANGLES[current];
  const facingTravel=Math.cos(oldYaw+bearing);
  const arrivalYaw=oldYaw+routeBearings[from]-routeBearings[i];
  transitioning=true;el.title='';dragging=false;gesture=null;touches.clear();pinchDistance=null;hoverHotspot=null;updateControls();
  document.body.classList.add('moving');app.setAttribute('aria-busy','true');el.style.cursor='progress';
  const status=document.getElementById('status');status.textContent='';
  // Keep the current panorama visible while the next one decodes.
  const slowLoad=setTimeout(()=>{status.textContent='Preparing next view…';},1200);
  try{
    const cached=preloadCache.get(i);
    const gltf=cached?await cached:await loader.loadAsync(DATA[i]);
    preloadCache.delete(i);if(preloadWanted===i)preloadWanted=null;
    if(!gltf)throw new Error('Checkpoint preload failed');
    clearTimeout(slowLoad);status.textContent='';
    hotspotGroup.visible=false;
    renderer.render(scene,camera);
    travelFrame.width=el.width;travelFrame.height=el.height;
    travelContext.drawImage(el,0,0);
    const anchor=new THREE.Vector3(Math.sin(bearing),0.03,-Math.cos(bearing));
    camera.updateMatrixWorld();anchor.project(camera);
    const ox=THREE.MathUtils.clamp((anchor.x+1)*50,15,85);
    const oy=THREE.MathUtils.clamp((1-anchor.y)*50,20,80);
    travelFrame.style.transformOrigin=ox+'% '+oy+'%';
    travelFrame.style.transform='none';travelFrame.style.filter='none';travelFrame.style.opacity='1';travelFrame.style.display='block';
    await loadCheckpoint(i,gltf);
    yaw=arrivalYaw;pitch=oldPitch;camera.fov=oldFov;camera.updateProjectionMatrix();camera.rotation.set(pitch,yaw,0);
    const arrivalBearing=routeBearings[i]+(direction<0?Math.PI:0);
    const drift=new THREE.Vector3(Math.sin(arrivalBearing),0,-Math.cos(arrivalBearing)).multiplyScalar(0);
    await tween(reducedMotion?180:620,(e,t)=>{
      camera.position.set(drift.x*(1-e),CAMERA_HEIGHT,drift.z*(1-e));
      if(!reducedMotion){
        travelFrame.style.transform='scale('+(1+0.13*e*facingTravel)+')';
        travelFrame.style.filter='blur('+(Math.sin(Math.PI*t)*1.2)+'px)';
      }
      // A brief push forward leads into the overlap; there is no blank/loading screen.
      travelFrame.style.opacity=String(1-THREE.MathUtils.smoothstep(t,reducedMotion?0:0.12,1));
    });
  }catch(err){
    console.error(err);status.textContent='This checkpoint could not load. Please try again.';
  }finally{
    clearTimeout(slowLoad);travelFrame.style.display='none';travelContext.clearRect(0,0,travelFrame.width,travelFrame.height);
    camera.position.set(0,CAMERA_HEIGHT,0);hotspotGroup.visible=true;
    document.body.classList.remove('moving');app.setAttribute('aria-busy','false');transitioning=false;el.style.cursor='grab';updateControls();scheduleLikelyPreload();
  }
}
const touches=new Map();let gesture=null, pinchDistance=null;
el.addEventListener('pointerdown',e=>{
  if(!ready || transitioning || e.button!==0)return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});el.setPointerCapture(e.pointerId);
  if(touches.size>1){gesture=null;dragging=false;pinchDistance=null;return;}
  checkHotspotHover(e.clientX,e.clientY);
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,yaw,pitch,hit:hoverHotspot,moved:false};dragging=true;
});
el.addEventListener('pointermove',e=>{
  if(transitioning)return;
  if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){const [a,b]=[...touches.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchDistance!==null)zoom((pinchDistance-d)*0.12);pinchDistance=d;return;}
  if(gesture && gesture.id===e.pointerId){
    const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
    if(Math.hypot(dx,dy)>8)gesture.moved=true;
    if(gesture.moved){yaw=gesture.yaw-dx*0.004;pitch=THREE.MathUtils.clamp(gesture.pitch-dy*0.004,-1.45,1.45);camera.rotation.set(pitch,yaw,0);}
  }
  checkHotspotHover(e.clientX,e.clientY);
});
function release(e,cancelled=false){
  const g=gesture;touches.delete(e.pointerId);pinchDistance=null;dragging=false;
  if(g?.id===e.pointerId){checkHotspotHover(e.clientX,e.clientY);gesture=null;if(g.moved&&motionEnabled)motionNeedsCalibrate=true;if(!cancelled && !g.moved && Math.hypot(e.clientX-g.x,e.clientY-g.y)<8 && g.hit && hoverHotspot===g.hit)transitionTo(current+(g.hit.userData.kind==='forward'?1:-1));}
  if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);
}
el.addEventListener('pointerup',e=>release(e));
el.addEventListener('pointercancel',e=>release(e,true));
el.addEventListener('lostpointercapture',()=>{gesture=null;dragging=false;});
el.addEventListener('pointerleave',()=>{hoverHotspot=null;el.title='';el.style.cursor='grab';});

// Optional phone-motion view. It is calibrated to the current camera direction,
// so enabling it never snaps the visitor to an unrelated bearing.
const motion=document.getElementById('motion');
let motionEnabled=false, motionNeedsCalibrate=true;
const motionReference=new THREE.Quaternion();
const sensorEuler=new THREE.Euler();
const sensorQuat=new THREE.Quaternion();
const sensorCorrection=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5));
const sensorScreenCorrection=new THREE.Quaternion();
const sensorZ=new THREE.Vector3(0,0,1);
const motionCapable=typeof DeviceOrientationEvent!=='undefined' && (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window);
motion.hidden=!motionCapable;
motion.setAttribute('aria-pressed','false');
function screenAngle(){return THREE.MathUtils.degToRad(screen.orientation?.angle ?? window.orientation ?? 0);}
function deviceQuaternion(e){
  if(e.alpha==null || e.beta==null || e.gamma==null)return null;
  sensorEuler.set(THREE.MathUtils.degToRad(e.beta),THREE.MathUtils.degToRad(e.alpha),-THREE.MathUtils.degToRad(e.gamma),'YXZ');
  sensorQuat.setFromEuler(sensorEuler);
  sensorQuat.multiply(sensorCorrection);
  sensorQuat.multiply(sensorScreenCorrection.setFromAxisAngle(sensorZ,-screenAngle()));
  return sensorQuat;
}
addEventListener('deviceorientation',e=>{
  if(!motionEnabled || dragging || transitioning)return;
  const q=deviceQuaternion(e);if(!q)return;
  if(motionNeedsCalibrate){motionReference.copy(camera.quaternion).multiply(q.clone().invert());motionNeedsCalibrate=false;}
  camera.quaternion.copy(motionReference).multiply(q);
  yaw=camera.rotation.y;pitch=camera.rotation.x;
},true);
if(screen.orientation?.addEventListener)screen.orientation.addEventListener('change',()=>{if(motionEnabled)motionNeedsCalibrate=true;});
else addEventListener('orientationchange',()=>{if(motionEnabled)motionNeedsCalibrate=true;});
motion.onclick=async()=>{
  const status=document.getElementById('status');
  if(motionEnabled){
    motionEnabled=false;motion.setAttribute('aria-pressed','false');motion.setAttribute('aria-label','Enable phone motion view');
    yaw=camera.rotation.y;pitch=camera.rotation.x;status.textContent='Phone motion view off.';updateControls();
    setTimeout(()=>{if(status.textContent==='Phone motion view off.')status.textContent='';},1300);return;
  }
  try{
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const permission=await DeviceOrientationEvent.requestPermission();
      if(permission!=='granted')throw new Error('permission denied');
    }
    motionEnabled=true;motionNeedsCalibrate=true;motion.setAttribute('aria-pressed','true');motion.setAttribute('aria-label','Disable phone motion view');
    status.textContent='Phone motion view on · move your phone to look around.';updateControls();
    setTimeout(()=>{if(status.textContent.startsWith('Phone motion view on'))status.textContent='';},2200);
  }catch(err){status.textContent='Phone motion access was not allowed. You can still drag to look around.';}
};

function zoom(delta){if(!ready || transitioning)return;camera.fov=THREE.MathUtils.clamp(camera.fov+delta,35,95);camera.updateProjectionMatrix();}
el.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY*0.03);},{passive:false});
previous.onclick=()=>transitionTo(current-1);next.onclick=()=>transitionTo(current+1);
document.getElementById('reset').onclick=()=>{if(ready&&!transitioning)resetView();};
document.getElementById('zoom-in').onclick=()=>zoom(-8);document.getElementById('zoom-out').onclick=()=>zoom(8);
const fullscreen=document.getElementById('fullscreen');
fullscreen.hidden=!document.fullscreenEnabled;
fullscreen.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('status').textContent='Full screen is unavailable in this browser.';}};
document.addEventListener('fullscreenchange',()=>fullscreen.setAttribute('aria-label',document.fullscreenElement?'Exit full screen':'Full screen'));
addEventListener('keydown',e=>{if(e.target.closest('button,input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();transitionTo(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();transitionTo(current-1);}
  if(e.key==='Home' && ready && !transitioning){e.preventDefault();resetView();}
  if(e.key==='+' || e.key==='='){e.preventDefault();zoom(-8);}
  if(e.key==='-'){e.preventDefault();zoom(8);}
});
updateControls();
addEventListener('resize', ()=>{
  renderQuality();
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
function animate(now=0){ requestAnimationFrame(animate); updateHotspotVisuals(now); renderer.render(scene,camera); }
animate();
setCanvasFx(1,0,1);
el.style.cursor='grab';
loadCheckpoint(0).then(()=>scheduleLikelyPreload()).catch(err=>{
  loading.innerHTML='<div class="error"><b>Could not load the tour.</b><p>Check your internet connection, then reload this page in Chrome, Edge, Safari, or Firefox.</p><button class="tool" onclick="location.reload()" aria-label="Retry">↻</button></div>';
  console.error(err);
});
</script>
</body>
</html>
